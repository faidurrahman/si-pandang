<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f172a">
    <link rel="manifest" href="/manifest.json">
    <title>SI-PANDANG | Kecamatan Ujung Pandang</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <script>
      window.deferredPrompt = null;
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        window.deferredPrompt = e;
      });
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; scroll-behavior: smooth; }
        
        .hero-bg {
            background: linear-gradient(180deg, #0a1e3b 0%, #081225 100%);
            position: relative;
        }

        .wave-bottom {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            line-height: 0;
        }

        .wave-bottom svg {
            position: relative;
            display: block;
            width: calc(100% + 1.3px);
            height: auto;
        }

        .wave-bottom .shape-fill {
            fill: #fafafa;
        }

        /* 3. Penyesuaian Header agar Logo di Kiri & Ikon di Kanan */
        .header-container {
            display: flex !important;
            justify-content: space-between !important;
            align-items: center;
            flex-direction: row !important;
            width: 100%;
            padding: 10px 0;
            min-height: 60px; /* Menjamin ketinggian area header */
        }

        .nav-icons-wrapper {
            display: flex !important;
            gap: 15px;
            order: 2;
        }

        .header-logo {
            order: 1;
            display: flex;
            align-items: center;
        }

        /* Tampilan Desktop: Memindahkan navigasi ke ujung kanan atas */
        @media (min-width: 1024px) {
            .header-container {
                justify-content: space-between !important;
                max-width: none !important; /* Hapus batasan lebar pada desktop agar bisa mencapai pojok */
            }
        }

        /* 4. Border Tombol Mulai Layanan */
        .btn-mulai-layanan {
            background-color: #d4a017; /* Warna emas/kuning */
            color: #ffffff !important;
            border: 2px solid #ffffff !important; /* Border putih tegas */
            padding: 12px 30px;
            border-radius: 12px;
            font-weight: 800;
            text-transform: uppercase;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .btn-mulai-layanan:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(212, 160, 23, 0.4);
            filter: brightness(1.1);
        }

        /* Mobile Adjustments */
        @media (max-width: 768px) {
            header {
                padding: 10px 20px !important;
                background: rgba(10, 30, 59, 0.9);
                backdrop-filter: blur(10px);
                height: auto !important;
            }

            .header-logo img, .header-logo .logo-placeholder {
                height: 35px !important;
            }

            /* Perbaikan Total Kontak Admin untuk Mode Mobile */
            .contact-section, .contact-container {
                padding: 10px !important;
                width: 100% !important;
                box-sizing: border-box; /* Menghitung padding agar tidak menambah lebar */
            }

            .contact-item {
                display: flex !important;
                flex-direction: row !important; /* Ikon di kiri, teks di kanan */
                align-items: center !important;
                width: 100% !important;
                padding: 12px !important;
                margin-bottom: 10px !important;
                gap: 12px !important; /* Jarak antara ikon dan teks */
                box-sizing: border-box;
                border-radius: 20px !important;
            }

            .contact-text {
                flex: 1 !important; /* Mengambil sisa ruang yang tersedia */
                min-width: 0 !important; /* Memungkinkan teks untuk mengecil/wrap */
            }

            .contact-text h4 {
                font-size: 13px !important;
                margin: 0 0 2px 0 !important;
                text-transform: uppercase;
                color: #666;
            }

            .contact-text p {
                font-size: 14px !important;
                margin: 0 !important;
                word-wrap: break-word !important; /* Memaksa teks panjang (email) pindah baris */
                overflow-wrap: break-word !important;
                white-space: normal !important; /* Memungkinkan teks turun ke bawah */
                line-height: 1.4 !important;
            }

            .contact-icon {
                width: 40px !important;
                height: 40px !important;
                min-width: 40px !important; /* Mencegah ikon menciut */
                display: flex !important;
                align-items: center !important;
                justify-content: center !important;
            }
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0a1e3b; }
        ::-webkit-scrollbar-thumb { background: #d4a017; border-radius: 10px; }
  /* Custom scrollbar for horizontal tables on mobile */
  .custom-scrollbar::-webkit-scrollbar {
      height: 6px;
      width: 6px;
  }
  .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent; 
  }
  .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 10px;
  }
  .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
  }
    </style>
    
</head>
<body class="bg-[#fafafa] text-slate-900 overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
