
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">

    <title>SI-PANDANG | Kecamatan Ujung Pandang</title>
    <!-- Shim untuk kompatibilitas SDK di browser -->
    <script>
        window.process = { 
            env: { 
                API_KEY: undefined 
            } 
        };
        // Coba ambil API Key dari metadata atau lingkungan jika tersedia
        try {
            // Jika menggunakan build Vite, variabel ini akan diinjeksi
            // Jika tidak, kita biarkan undefined agar service yang menangani
            window.process.env.API_KEY = window.localStorage.getItem('VITE_GOOGLE_GENERATIVE_AI_API_KEY');
        } catch (e) {}
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; scroll-behavior: smooth; }
        
        .hero-bg {
            background: linear-gradient(180deg, #0a1e3b 0%, #081225 100%);
            position: relative;
        }

        .hero-icon-container {
            background: linear-gradient(135deg, #7c3aed 0%, #4f46e5 100%);
            box-shadow: 0 20px 40px rgba(79, 70, 229, 0.3);
        }

        .badge-portal {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
        }

        .btn-mulai {
            background-color: #d4a017;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .btn-mulai:hover {
            background-color: #f1b61c;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(212, 160, 23, 0.3);
        }

        .wave-bottom {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            line-height: 0;
        }

        .wave-bottom svg {
            position: relative;
            display: block;
            width: calc(100% + 1.3px);
            height: 60px;
        }

        .wave-bottom .shape-fill {
            fill: #fafafa;
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0a1e3b; }
        ::-webkit-scrollbar-thumb { background: #d4a017; border-radius: 10px; }
    </style>
