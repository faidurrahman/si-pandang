<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SI-PANDANG | Kecamatan Ujung Pandang</title>
    <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1O0K6-vP-I_o_X_Y2k7JzH2X3DqZ3u6zI">
    <link rel="shortcut icon" type="image/png" href="https://lh3.googleusercontent.com/d/1O0K6-vP-I_o_X_Y2k7JzH2X3DqZ3u6zI">
    <link rel="apple-touch-icon" href="https://lh3.googleusercontent.com/d/1O0K6-vP-I_o_X_Y2k7JzH2X3DqZ3u6zI">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; scroll-behavior: smooth; }
        
        .hero-bg {
            background: linear-gradient(180deg, #0a1e3b 0%, #081225 100%);
            position: relative;
        }

        .wave-bottom {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            line-height: 0;
        }

        .wave-bottom svg {
            position: relative;
            display: block;
            width: calc(100% + 1.3px);
            height: auto;
        }

        .wave-bottom .shape-fill {
            fill: #fafafa;
        }

        /* 1. Definisi Animasi Gabungan: Melayang + Berdenyut */
        @keyframes asisten-animation {
            0% {
                transform: translateY(0px);
                box-shadow: 0 10px 20px rgba(255, 165, 0, 0.3);
            }
            50% {
                transform: translateY(-8px);
                box-shadow: 0 20px 30px rgba(255, 165, 0, 0.5);
            }
            100% {
                transform: translateY(0px);
                box-shadow: 0 10px 20px rgba(255, 165, 0, 0.3);
            }
        }

        /* 2. Style Utama Tombol Asisten SI-PANDANG (REVISI CIRCULAR FAB) */
        .btn-asisten-ai {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 999;
            background-color: #FFA500; /* Warna Orange Identitas */
            color: #0a1e3b;
            width: 64px; /* Lebar tetap untuk lingkaran */
            height: 64px; /* Tinggi tetap untuk lingkaran */
            border-radius: 50%; /* Lingkaran Sempurna */
            border: 3px solid #fff; /* Border putih agar kontras */
            display: flex;
            align-items: center;
            justify-content: center; /* Ikon di tengah */
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); /* Efek membal saat hover */
            animation: asisten-animation 4s ease-in-out infinite;
        }

        .btn-asisten-ai:hover {
            transform: scale(1.15) rotate(-5deg);
            background-color: #ffb700;
            box-shadow: 0 20px 40px rgba(255, 165, 0, 0.6);
        }

        /* 3. Penyesuaian Header agar Logo di Kiri & Ikon di Kanan */
        .header-container {
            display: flex !important;
            justify-content: space-between !important;
            align-items: center;
            flex-direction: row !important;
            width: 100%;
            padding: 10px 0;
            min-height: 60px; /* Menjamin ketinggian area header */
        }

        .nav-icons-wrapper {
            display: flex !important;
            gap: 15px;
            order: 2;
            margin-left: auto; /* Memaksa ikon tetap ke kanan meskipun area kiri kosong */
        }

        .header-logo {
            order: 1;
            min-width: 1px; /* Spacer minimal */
        }

        /* Tampilan Desktop: Memindahkan navigasi ke ujung kanan atas */
        @media (min-width: 1024px) {
            .header-container {
                justify-content: flex-end !important;
                max-width: none !important; /* Hapus batasan lebar pada desktop agar bisa mencapai pojok */
            }
            .nav-icons-wrapper {
                margin-left: 0 !important; /* Parent flex-end yang mengatur perataan */
            }
        }

        /* 4. Border Tombol Mulai Layanan */
        .btn-mulai-layanan {
            background-color: #d4a017 !important; /* Warna emas/kuning */
            color: #ffffff !important;
            border: 2px solid #ffffff !important; /* Border putih tegas */
            padding: 12px 30px;
            border-radius: 12px;
            font-weight: 800;
            text-transform: uppercase;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .btn-mulai-layanan:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(212, 160, 23, 0.4);
            filter: brightness(1.1);
        }

        /* Mobile Adjustments */
        @media (max-width: 768px) {
            header {
                padding: 10px 20px !important;
                background: rgba(10, 30, 59, 0.9);
                backdrop-filter: blur(10px);
                height: auto !important;
            }

            .header-logo img, .header-logo .logo-placeholder {
                height: 35px !important;
            }

            /* FIX: Posisi tombol AI Assistant di Mobile agar tidak menutupi tombol lain */
            .btn-asisten-ai {
                bottom: 90px !important; 
                right: 20px !important;
                width: 56px; /* Ukuran sedikit lebih kecil di HP */
                height: 56px;
            }

            /* Perbaikan Total Kontak Admin untuk Mode Mobile */
            .contact-section, .contact-container {
                padding: 10px !important;
                width: 100% !important;
                box-sizing: border-box; /* Menghitung padding agar tidak menambah lebar */
            }

            .contact-item {
                display: flex !important;
                flex-direction: row !important; /* Ikon di kiri, teks di kanan */
                align-items: center !important;
                width: 100% !important;
                padding: 12px !important;
                margin-bottom: 10px !important;
                gap: 12px !important; /* Jarak antara ikon dan teks */
                box-sizing: border-box;
                border-radius: 20px !important;
            }

            .contact-text {
                flex: 1 !important; /* Mengambil sisa ruang yang tersedia */
                min-width: 0 !important; /* Memungkinkan teks untuk mengecil/wrap */
            }

            .contact-text h4 {
                font-size: 13px !important;
                margin: 0 0 2px 0 !important;
                text-transform: uppercase;
                color: #666;
            }

            .contact-text p {
                font-size: 14px !important;
                margin: 0 !important;
                word-wrap: break-word !important; /* Memaksa teks panjang (email) pindah baris */
                overflow-wrap: break-word !important;
                white-space: normal !important; /* Memungkinkan teks turun ke bawah */
                line-height: 1.4 !important;
            }

            .contact-icon {
                width: 40px !important;
                height: 40px !important;
                min-width: 40px !important; /* Mencegah ikon menciut */
                display: flex !important;
                align-items: center !important;
                justify-content: center !important;
            }
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0a1e3b; }
        ::-webkit-scrollbar-thumb { background: #d4a017; border-radius: 10px; }
    </style>
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",

  }

</script>
</head>
<body class="bg-[#fafafa] text-slate-900 overflow-x-hidden">

    <script>
      (function() {
          var link = document.querySelector("link[rel*='icon']") || document.createElement('link');
          link.type = 'image/png';
          link.rel = 'shortcut icon';
          link.href = 'https://lh3.googleusercontent.com/d/1O0K6-vP-I_o_X_Y2k7JzH2X3DqZ3u6zI';
          document.getElementsByTagName('head')[0].appendChild(link);
      })();
    </script>
</body>
</html>
